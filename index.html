<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Coffee Need Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>How Much Coffee Do You Need Today?</h1>

  <p>Your name:</p>
  <input type="text" id="userName" placeholder="e.g. Balaussa">

  <p>How many hours have you been awake?</p>
  <input type="number" id="hoursAwake" placeholder="e.g. 7">

  <p>How tired are you right now? (1–10)</p>
  <input type="number" id="tirednessLevel" min="1" max="10" placeholder="e.g. 6">

  <br><br>
  <button onclick="calculateCoffee()">Calculate ☕</button>

  <div id="result"></div>

  <script src="script.js"></script>
</body>
</html>
