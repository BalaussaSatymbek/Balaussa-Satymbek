<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Coffee Need Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Coffee Need Calculator ☕</h1>

  <form id="coffeeForm">
    <label>Your Name:</label>
    <input type="text" id="name" required>

    <label>Hours Awake:</label>
    <input type="number" id="hours" min="0" required>

    <label>Tiredness Level (1–10):</label>
    <input type="number" id="tiredness" min="1" max="10" required>

    <button type="submit">Calculate</button>
  </form>

  <div id="result"></div>

  <script src="script.js"></script>
</body>
</html>
